# Updated: 2026-09-15 09:20 JST
name: Deploy production site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "preview/**"
      - "content/**"
      - "data/content_registry.json"
      - "data/content_registry_additions*.json"
      - "data/content_registry_updates*.json"
      - "config/site.json"
      - "templates/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Synchronize reviewed Markdown into preview HTML
        run: python scripts/sync_previews_from_markdown.py

      - name: Enhance linear-rainband feature navigation
        run: python scripts/enhance_linear_rainband_feature.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build production files
        run: python scripts/build_public.py

      - name: Finalize search metadata
        run: python scripts/finalize_search_metadata.py

      - name: Check JavaScript syntax
        run: |
          node --check public/bousai_common.js
          node --check public/bousai_home.js

      - name: Localize Commons site images safely
        run: python scripts/localize_commons_images_ci.py --min-localized 1

      - name: Verify build is safe to deploy
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          public = Path("public")
          manifest_path = public / "assets/images/commons/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          failed = manifest.get("unique_images_failed", 0)
          if failed:
              raise SystemExit(f"Commons localization manifest contains {failed} failed image(s)")

          pattern = re.compile(r'src="https://(?:commons|upload)\.wikimedia\.org/', re.IGNORECASE)
          offenders = []
          for page in sorted(public.rglob("*.html")):
              if pattern.search(page.read_text(encoding="utf-8")):
                  offenders.append(page.relative_to(public).as_posix())

          if offenders:
              sample = ", ".join(offenders[:10])
              raise SystemExit(
                  "External Wikimedia image src remains before deployment: " + sample
              )

          print("Pre-deploy integrity check passed.")
          PY

      - name: Show production manifest
        run: |
          echo "HTML files: $(find public -type f -name '*.html' | wc -l)"
          echo "Total files: $(find public -type f | wc -l)"
          find public -type f | sort

      - name: Deploy to Ninja Homepage via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.homepage.shinobi.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          security: strict
          timeout: 60000
          exclude: |
            realtime/**

      - name: Smoke test public site
        run: |
          BASE_URL="$(python - <<'PY'
          import json
          with open("config/site.json", encoding="utf-8") as f:
              print(json.load(f)["public_base_url"].rstrip("/") + "/")
          PY
          )"
          echo "Testing ${BASE_URL}"

          fetch_public() {
            path="$1"
            output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --connect-timeout 15 --max-time 90 \
              --header "Cache-Control: no-cache" \
              "${BASE_URL}${path}" -o "${output}"
            sleep 1
          }

          tmp_home="$(mktemp)"
          fetch_public "" "${tmp_home}"
          python - "${tmp_home}" "${BASE_URL}" <<'PY'
          import re
          import sys

          path, base_url = sys.argv[1:3]
          html = open(path, encoding="utf-8").read()
          checks = {
              "site brand": "防災くらしガイド" in html,
              "skip link": 'class="skip-link"' in html,
              "main content id": 'id="main-content"' in html,
              "canonical": f'<link rel="canonical" href="{base_url}">' in html,
              "localized Commons image": "assets/images/commons/" in html,
              "realtime root": "data-realtime-root" in html,
              "no external Wikimedia image src": not bool(
                  re.search(r'src="https://(?:commons|upload)\\.wikimedia\\.org/', html, re.I)
              ),
          }
          for label, passed in checks.items():
              print(f"Homepage smoke: {label}: {'PASS' if passed else 'FAIL'}")
          failed = [label for label, passed in checks.items() if not passed]
          if failed:
              print(f"Homepage fetched bytes: {len(html.encode('utf-8'))}")
              for pattern in (
                  r"<title>.*?</title>",
                  r'<link rel="canonical"[^>]*>',
                  r'<main[^>]*>',
                  r'<a class="skip-link"[^>]*>',
              ):
                  match = re.search(pattern, html, re.I | re.S)
                  print(f"Diagnostic {pattern}: {match.group(0)[:500] if match else 'NOT FOUND'}")
              raise SystemExit("Homepage smoke check failed: " + ", ".join(failed))
          PY
          rm -f "${tmp_home}"

          tmp_article="$(mktemp)"
          fetch_public "guide/first-disaster-preparedness.html" "${tmp_article}"
          grep -q "防災くらしガイド" "${tmp_article}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}guide/first-disaster-preparedness.html\">" "${tmp_article}"
          grep -q 'data-generated="article-structured-data"' "${tmp_article}"
          grep -q '"@type":"BlogPosting"' "${tmp_article}"
          grep -q '"@type":"BreadcrumbList"' "${tmp_article}"
          rm -f "${tmp_article}"

          tmp_insurance="$(mktemp)"
          fetch_public "insurance/disaster-insurance-overview.html" "${tmp_insurance}"
          grep -q "なぜ5段階に分けるのか" "${tmp_insurance}"
          grep -q "原因 → 被害物 → 契約対象 → 原因の補償 → 支払条件" "${tmp_insurance}"
          grep -q "ケース5：賃貸住宅" "${tmp_insurance}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}insurance/disaster-insurance-overview.html\">" "${tmp_insurance}"
          grep -q 'data-generated="article-structured-data"' "${tmp_insurance}"
          rm -f "${tmp_insurance}"

          tmp_region="$(mktemp)"
          fetch_public "region/miyagi/earthquake-tsunami-history.html" "${tmp_region}"
          grep -q "1978年宮城県沖地震" "${tmp_region}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}region/miyagi/earthquake-tsunami-history.html\">" "${tmp_region}"
          grep -q 'data-generated="article-structured-data"' "${tmp_region}"
          rm -f "${tmp_region}"

          tmp_mabi="$(mktemp)"
          fetch_public "region/okayama/mabi-2018-flood-history.html" "${tmp_mabi}"
          grep -q "倉敷市真備地区の水害史" "${tmp_mabi}"
          grep -q "約1,200ha" "${tmp_mabi}"
          grep -q "2024年3月" "${tmp_mabi}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}region/okayama/mabi-2018-flood-history.html\">" "${tmp_mabi}"
          grep -q 'data-generated="article-structured-data"' "${tmp_mabi}"
          rm -f "${tmp_mabi}"

          tmp_linear="$(mktemp)"
          fetch_public "special/linear-rainband/index.html" "${tmp_linear}"
          grep -q "線状降水帯とは？" "${tmp_linear}"
          grep -q "地域から線状降水帯を見る" "${tmp_linear}"
          grep -q "警戒レベル5" "${tmp_linear}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}special/linear-rainband/index.html\">" "${tmp_linear}"
          grep -q 'data-generated="article-structured-data"' "${tmp_linear}"
          rm -f "${tmp_linear}"

          tmp_linear_region="$(mktemp)"
          fetch_public "special/linear-rainband/regions.html" "${tmp_linear_region}"
          grep -q "地域から線状降水帯を見る" "${tmp_linear_region}"
          grep -q "九州" "${tmp_linear_region}"
          grep -q "関東甲信" "${tmp_linear_region}"
          grep -q "中国地方" "${tmp_linear_region}"
          grep -q "四国" "${tmp_linear_region}"
          grep -q "東海" "${tmp_linear_region}"
          rm -f "${tmp_linear_region}"

          tmp_flood_index="$(mktemp)"
          fetch_public "flood/index.html" "${tmp_flood_index}"
          grep -q "注目特集：線状降水帯" "${tmp_flood_index}"
          rm -f "${tmp_flood_index}"

          tmp_region_index="$(mktemp)"
          fetch_public "region/index.html" "${tmp_region_index}"
          grep -q "8地域・8記事" "${tmp_region_index}"
          grep -q "倉敷市真備地区の水害史" "${tmp_region_index}"
          grep -q "線状降水帯を地域から見る" "${tmp_region_index}"
          rm -f "${tmp_region_index}"

          tmp_pet_index="$(mktemp)"
          fetch_public "pet/index.html" "${tmp_pet_index}"
          grep -q "ペット防災" "${tmp_pet_index}"
          grep -q "ペットは避難所に入れる？" "${tmp_pet_index}"
          grep -q "ペットと車中泊避難しても大丈夫？" "${tmp_pet_index}"
          rm -f "${tmp_pet_index}"

          tmp_pet_shelter="$(mktemp)"
          fetch_public "pet/shelter-pet-evacuation.html" "${tmp_pet_shelter}"
          grep -q "同行避難" "${tmp_pet_shelter}"
          grep -q "同じ室内で生活できるとは限りません" "${tmp_pet_shelter}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}pet/shelter-pet-evacuation.html\">" "${tmp_pet_shelter}"
          grep -q 'data-generated="article-structured-data"' "${tmp_pet_shelter}"
          rm -f "${tmp_pet_shelter}"

          tmp_pet_vehicle="$(mktemp)"
          fetch_public "pet/pet-vehicle-overnight.html" "${tmp_pet_vehicle}"
          grep -q "エコノミークラス症候群" "${tmp_pet_vehicle}"
          grep -q "車中泊以外の避難先" "${tmp_pet_vehicle}"
          rm -f "${tmp_pet_vehicle}"

          tmp_product="$(mktemp)"
          fetch_public "goods/toilet-hygiene.html" "${tmp_product}"
          grep -q 'class="article-shell product-page"' "${tmp_product}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}goods/toilet-hygiene.html\">" "${tmp_product}"
          grep -q '商品情報より' "${tmp_product}"
          rm -f "${tmp_product}"

          tmp_volcanic_goods="$(mktemp)"
          fetch_public "goods/volcanic-ash-protection.html" "${tmp_volcanic_goods}"
          grep -q "火山灰対策グッズの選び方" "${tmp_volcanic_goods}"
          grep -Fq "<link rel=\"canonical\" href=\"${BASE_URL}goods/volcanic-ash-protection.html\">" "${tmp_volcanic_goods}"
          grep -q 'B081YKHRLB' "${tmp_volcanic_goods}"
          grep -q 'B079BNC5XQ' "${tmp_volcanic_goods}"
          grep -q 'B08NT64H61' "${tmp_volcanic_goods}"
          grep -q '2AQ1UZ6-products_ja_mainimage.png' "${tmp_volcanic_goods}"
          grep -q '2AQ1UZ5-products_ja_mainimage.png' "${tmp_volcanic_goods}"
          grep -q '2AQ1V59-products_ja_mainimage.png' "${tmp_volcanic_goods}"
          grep -q 'data-generated="article-structured-data"' "${tmp_volcanic_goods}"
          if grep -q 'amazon.co.jp/s?k=' "${tmp_volcanic_goods}"; then
            echo "B060 must use direct Amazon product links, but a search link remains."
            exit 1
          fi
          rm -f "${tmp_volcanic_goods}"

          tmp_js="$(mktemp)"
          fetch_public "bousai_common.js" "${tmp_js}"
          grep -q '"amazon_click"' "${tmp_js}"
          grep -q '"product_guide_click"' "${tmp_js}"
          grep -q 'enhanceAccessibility' "${tmp_js}"
          grep -q 'aria-current' "${tmp_js}"
          if grep -q 'initRealtimePanel' "${tmp_js}"; then
            echo "Realtime homepage logic must not remain in bousai_common.js."
            exit 1
          fi
          rm -f "${tmp_js}"

          tmp_css="$(mktemp)"
          fetch_public "bousai_common.css" "${tmp_css}"
          grep -q '\.skip-link' "${tmp_css}"
          grep -q 'prefers-reduced-motion' "${tmp_css}"
          if grep -q 'h2:nth-of-type(3n + 1) + p' "${tmp_css}"; then
            echo "Arbitrary periodic warning styling must not be present."
            exit 1
          fi
          rm -f "${tmp_css}"

          tmp_home_js="$(mktemp)"
          fetch_public "bousai_home.js" "${tmp_home_js}"
          grep -q 'initRealtimePanel' "${tmp_home_js}"
          grep -q '台風等' "${tmp_home_js}"
          grep -q 'bosai/quake/data/list.json' "${tmp_home_js}"
          grep -q 'bosai/warning/data/r8/map.json' "${tmp_home_js}"
          grep -q 'bosai/typhoon/data/targetTc.json' "${tmp_home_js}"
          rm -f "${tmp_home_js}"

          tmp_manifest="$(mktemp)"
          fetch_public "assets/images/commons/manifest.json" "${tmp_manifest}"
          python - "${tmp_manifest}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          if data.get("unique_images_failed", 0) != 0:
              raise SystemExit("Published Commons manifest contains failed images")
          PY
          rm -f "${tmp_manifest}"

          tmp_realtime="$(mktemp)"
          fetch_public "realtime/realtime.json" "${tmp_realtime}"
          python -m json.tool "${tmp_realtime}" >/dev/null
          rm -f "${tmp_realtime}"

          tmp_sitemap="$(mktemp)"
          fetch_public "sitemap.xml" "${tmp_sitemap}"
          grep -q "<urlset" "${tmp_sitemap}"
          grep -q "${BASE_URL}goods/portable-power-station-disaster.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}goods/volcanic-ash-protection.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}water-outage/portable-toilet-stockpile.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}region/miyagi/earthquake-tsunami-history.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}region/hiroshima/landslide-history.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}region/arakawa/flood-history.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}region/okayama/mabi-2018-flood-history.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}special/linear-rainband/index.html" "${tmp_sitemap}"
          grep -q "${BASE_URL}special/linear-rainband/regions.html" "${tmp_sitemap}"
          rm -f "${tmp_sitemap}"

          googlebot_status="$(curl --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --user-agent "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
            --output /dev/null --write-out "%{http_code}" \
            "${BASE_URL}sitemap.xml")"
          echo "Googlebot sitemap HTTP status: ${googlebot_status}"
          test "${googlebot_status}" = "200"

          echo "Public smoke test passed."

      - name: Audit live sitemap indexability
        run: python scripts/check_live_indexability.py --workers 4
