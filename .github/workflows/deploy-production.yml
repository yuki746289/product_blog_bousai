# Updated: 2026-09-08 14:10 JST
name: Deploy production site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "preview/**"
      - "content/**"
      - "data/content_registry.json"
      - "data/content_registry_additions*.json"
      - "data/content_registry_updates*.json"
      - "config/site.json"
      - "templates/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build production files
        run: python scripts/build_public.py

      - name: Finalize search metadata
        run: python scripts/finalize_search_metadata.py

      - name: Check JavaScript syntax
        run: |
          node --check public/bousai_common.js
          node --check public/bousai_home.js

      - name: Localize Commons site images safely
        run: python scripts/localize_commons_images_ci.py --min-localized 1

      - name: Verify build is safe to deploy
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          public = Path("public")
          manifest_path = public / "assets/images/commons/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          failed = manifest.get("unique_images_failed", 0)
          if failed:
              raise SystemExit(f"Commons localization manifest contains {failed} failed image(s)")

          pattern = re.compile(r'src="https://(?:commons|upload)\.wikimedia\.org/', re.IGNORECASE)
          offenders = []
          for page in sorted(public.rglob("*.html")):
              if pattern.search(page.read_text(encoding="utf-8")):
                  offenders.append(page.relative_to(public).as_posix())

          if offenders:
              raise SystemExit(
                  "External Commons image refs remain after localization: "
                  + ", ".join(offenders[:10])
              )

          print(
              f"Commons localization verified: {manifest.get('unique_images_localized', 0)} "
              "unique image(s), 0 failures, no external Commons image refs remain."
          )
          PY

      - name: Show production manifest
        run: find public -maxdepth 4 -type f | sort

      - name: FTPS deploy
        env:
          FTP_SERVER: ftps1.shinobi.jp
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          python -m pip install --quiet lftp || true
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp
          fi
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 20; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" $FTP_SERVER; mirror -R --verbose --delete --exclude-glob realtime/** public/ /; bye"

      - name: Public smoke
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://bousaikun.ashigaru.jp"
          paths = [
              "/",
              "/region/",
              "/region/okayama/mabi-2018-flood-history.html",
              "/goods/volcanic-ash-protection.html",
              "/sitemap.xml",
          ]
          for path in paths:
              url = base + path
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 bousai-deploy-smoke"},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          body = response.read().decode("utf-8", errors="replace")
                          status = response.status
                      print(f"{status} {url}")
                      if status == 200 and body.strip():
                          last = None
                          break
                      last = RuntimeError(f"unexpected response for {url}: {status}")
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(4)
              if last is not None:
                  raise last

          mabi_url = base + "/region/okayama/mabi-2018-flood-history.html"
          req = urllib.request.Request(
              mabi_url,
              headers={"User-Agent": "Mozilla/5.0 bousai-deploy-smoke"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              mabi = response.read().decode("utf-8", errors="replace")
          for needle in (
              "倉敷市真備地区の水害史",
              "平成30年7月豪雨",
              "小田川",
              "BlogPosting",
              "BreadcrumbList",
          ):
              if needle not in mabi:
                  raise SystemExit(f"B059 public smoke missing {needle!r}")

          b060_url = base + "/goods/volcanic-ash-protection.html"
          req = urllib.request.Request(
              b060_url,
              headers={"User-Agent": "Mozilla/5.0 bousai-deploy-smoke"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              b060 = response.read().decode("utf-8", errors="replace")
          for needle in (
              "B081YKHRLB",
              "B079BNC5XQ",
              "B08NT64H61",
              "DD02-S2-2K",
              "DD02V-S2-2K",
              "LX-22",
              "BlogPosting",
              "BreadcrumbList",
          ):
              if needle not in b060:
                  raise SystemExit(f"B060 public smoke missing {needle!r}")
          if "amazon.co.jp/s?k=" in b060:
              raise SystemExit("B060 public smoke found stale Amazon search link")

          req = urllib.request.Request(
              base + "/sitemap.xml",
              headers={"User-Agent": "Googlebot"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              sitemap = response.read().decode("utf-8", errors="replace")
              print(f"Googlebot sitemap HTTP status: {response.status}")
          for path in (
              "/region/okayama/mabi-2018-flood-history.html",
              "/goods/volcanic-ash-protection.html",
          ):
              if base + path not in sitemap:
                  raise SystemExit(f"sitemap missing {path}")

          print("Public smoke test passed.")
          PY
